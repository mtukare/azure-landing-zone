<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #e6edf3;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px;
    }
    h1 { font-size: 80px; font-weight: 700; color: #58a6ff; margin-bottom: 12px; }
    p  { font-size: 16px; color: #8b949e; margin-bottom: 24px; }
    a  {
      color: #58a6ff; background: #1f6feb1a;
      border: 1px solid #1f6feb44; border-radius: 6px;
      padding: 8px 20px; font-size: 14px; text-decoration: none;
    }
    a:hover { background: #1f6feb33; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn't exist — but the infrastructure that serves it does.</p>
    <a href="/">← Back to Portfolio</a>
  </div>
</body>
</html>
